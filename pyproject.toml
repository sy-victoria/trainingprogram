[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trainingprogram"
version = "0.2.0"
description = "Reproducible coding agent and Qwen quantization coursework"
requires-python = ">=3.11,<3.13"
dependencies = ["langgraph", "langgraph-checkpoint-sqlite", "httpx", "huggingface-hub", "psutil"]

[project.scripts]
tp = "trainingprogram.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
