name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/agent.lock
      - run: python -m pip install -r requirements/agent.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: tp --help
      - if: runner.os == 'Linux'
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
  sandbox:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/agent.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: bash scripts/build_sandbox.sh
      - run: python -m pytest -q tests/test_integration_docker.py
        env:
          TP_DOCKER_TESTS: '1'
